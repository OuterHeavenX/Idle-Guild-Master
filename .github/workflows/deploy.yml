name: Deploy Idle Guild Master to GitHub Pages

on:
  push:
    branches: [main, feature/dungeon-vertical-slice, feature/active-hero-control, feature/story-hub-first-quest, feature/story-loop-stabilization, feature/guild-town-authored-art]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
        env:
          VITE_BUILD_SHA: ${{ github.sha }}
          VITE_BUILD_BRANCH: ${{ github.ref_name }}
      - name: Create branch-specific acceptance copy
        if: github.ref_name == 'feature/guild-town-authored-art'
        run: |
          mkdir -p dist/guild-town-authored-art
          cp -R dist/assets dist/guild-town-authored-art/assets
          cp dist/index.html dist/guild-town-authored-art/index.html
          if [ -f dist/deploy-visual-proof.txt ]; then cp dist/deploy-visual-proof.txt dist/guild-town-authored-art/deploy-visual-proof.txt; fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
