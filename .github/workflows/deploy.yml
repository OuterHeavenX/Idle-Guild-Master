name: Deploy Idle Guild Master to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
        env:
          VITE_BUILD_SHA: ${{ github.sha }}
          VITE_BUILD_BRANCH: ${{ github.ref_name }}
      - name: Write deployment provenance
        run: |
          node -e "require('node:fs').writeFileSync('dist/build-info.json', JSON.stringify({ branch: process.env.GITHUB_REF_NAME, sha: process.env.GITHUB_SHA, builtAt: new Date().toISOString() }, null, 2) + '\n')"
      - name: Prepare Pages artifact
        run: |
          rm -rf page-artifact
          mkdir -p page-artifact/long-rain-expanded-guild-town
          cp -R dist/. page-artifact/
          cp -R dist/. page-artifact/long-rain-expanded-guild-town/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./page-artifact
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
