<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#090b10" />
    <title>Idle Guild Master</title>
    <style>
      html,body{margin:0;min-height:100%;background:#070910;color:#eee5d7;font-family:system-ui,-apple-system,sans-serif}
      #boot-status{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center;background:radial-gradient(circle at 50% 30%,#24172d 0,#0b0c13 45%,#070910 100%)}
      #boot-status .card{max-width:560px;padding:28px;border:1px solid #4d3d56;border-radius:18px;background:#111019e8;box-shadow:0 24px 80px #0008}
      #boot-status h1{margin:0 0 10px;font-family:Georgia,serif;letter-spacing:2px}
      #boot-status p{line-height:1.55;color:#cfc5d3}
      #boot-status strong{color:#f0c66f}
    </style>
  </head>
  <body>
    <div id="boot-status"><div class="card"><h1>IDLE GUILD MASTER</h1><p>Loading guild systems…</p></div></div>
    <div id="app"></div>
    <script>
      window.__IGM_BOOTED__ = false;
      window.setTimeout(() => {
        if (window.__IGM_BOOTED__) return;
        const status = document.getElementById('boot-status');
        if (status) status.innerHTML = '<div class="card"><h1>IDLE GUILD MASTER</h1><p><strong>Deployment build not loaded.</strong></p><p>GitHub Pages is serving the TypeScript source directly instead of the compiled Vite build. In GitHub, set <strong>Settings → Pages → Build and deployment → Source</strong> to <strong>GitHub Actions</strong>, then run the Pages workflow.</p></div>';
      }, 2500);
    </script>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
